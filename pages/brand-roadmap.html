        <!-- Main Content -->
        <main class="main">
            <!-- Header -->
            <header class="header">
                <div class="header__left">
                    <h1 class="header__title">Brand Roadmap</h1>
                    <span style="font-size: 13px; color: var(--color-text-tertiary); margin-left: 12px;">9 brands · 3 phases · Multi-brand content engine</span>
                </div>
                <div class="header__right">
                    <div id="brand-switcher"></div>
                </div>
            </header>

            <!-- Content -->
            <div class="content">
                <!-- Filters -->
                <div class="roadmap-page-header">
                    <div class="roadmap-filters">
                        <select id="filter-platform">
                            <option value="all">All Platforms</option>
                            <option value="youtube_shorts">YouTube Shorts</option>
                            <option value="instagram_reels">Instagram Reels</option>
                            <option value="tiktok">TikTok</option>
                            <option value="facebook_reels">Facebook Reels</option>
                            <option value="threads">Threads</option>
                            <option value="x">X / Twitter</option>
                        </select>
                        <select id="filter-engagement">
                            <option value="all">All Engagement</option>
                            <option value="replies">💬 Replies</option>
                            <option value="retention">⏱ Retention</option>
                            <option value="saves">💾 Saves</option>
                            <option value="shares">🔄 Shares</option>
                        </select>
                        <select id="filter-status">
                            <option value="all">All Statuses</option>
                            <option value="active">Active</option>
                            <option value="scaling">Scaling</option>
                            <option value="planned">Planned</option>
                            <option value="paused">Paused</option>
                        </select>
                    </div>
                </div>

                <!-- Dynamic Content -->
                <div id="roadmap-content">
                    <div class="roadmap-empty">
                        <div class="roadmap-empty__icon">🗺️</div>
                        <div class="roadmap-empty__text">Loading roadmap...</div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Detail Panel Overlay -->
        <div class="detail-overlay" id="detail-overlay">
            <div class="detail-panel" id="detail-panel">
                <!-- Populated by JS -->
            </div>
