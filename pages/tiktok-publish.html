    <script>
    // ── TikTok Publish Page Init ──
    (async function() {
        // Get post_id from URL query string
        const params = new URLSearchParams(window.location.search);
        const postId = params.get('post_id');

        // Wait for brandManager to be ready
        async function waitForBrand() {
            for (let i = 0; i < 20; i++) {
                if (typeof brandManager !== 'undefined' && brandManager.getActiveBrand()) return true;
                await new Promise(r => setTimeout(r, 200));
            }
            return false;
        }

        const brandReady = await waitForBrand();
        if (!brandReady) {
            document.getElementById('tiktok-publish-root').innerHTML =
                '<div style="text-align:center;padding:40px;color:var(--color-text-secondary);">Please select a brand first from the sidebar.</div>';
            return;
        }

        const brand = brandManager.getActiveBrand();

        // Init TikTok service
        const clientKey = localStorage.getItem('tiktok_client_key');
        const clientSecret = localStorage.getItem('tiktok_client_secret');
        if (clientKey) {
            tiktokService.init(clientKey, clientSecret);
        }
        await tiktokService.setBrand(brand.id);

        if (!tiktokService.isConnected()) {
            document.getElementById('tiktok-publish-root').innerHTML = `
                <div style="text-align:center;padding:40px;">
                    <h3 style="color:var(--color-text-primary);margin-bottom:12px;">TikTok Not Connected</h3>
                    <p style="color:var(--color-text-secondary);margin-bottom:20px;">Connect your TikTok account in the Connections page first.</p>
                    <a href="connections.html" style="color:var(--color-accent-primary);">Go to Connections →</a>
                </div>
            `;
            return;
        }

        // Load the post
        let post;
        if (postId) {
            const { data, error } = await supabaseClient
                .from('posts')
                .select('*')
                .eq('id', postId)
                .single();
            if (error || !data) {
                document.getElementById('tiktok-publish-root').innerHTML =
                    '<div style="text-align:center;padding:40px;color:var(--color-error);">Post not found.</div>';
                return;
            }
            post = data;
        } else {
            // Demo mode: show a sample post for TikTok app review
            post = {
                id: 'demo',
                title: 'Sample TikTok Post',
                description: 'This is a demo post for TikTok Content Sharing review.',
                video_url: '',
                duration_seconds: 30,
                platform_content: {
                    tiktok: {
                        caption: 'Check out this amazing content! #fyp #viral'
                    }
                },
                tags: ['fyp', 'viral', 'content'],
            };
        }

        // Mount the TikTok publish component inline (not as overlay)
        const root = document.getElementById('tiktok-publish-root');
        root.innerHTML = '';

        const publishReview = new TikTokPublishReview();
        publishReview.container = root;
        publishReview.post = post;
        publishReview.settings.title = post.platform_content?.tiktok?.caption || post.title || '';
        publishReview.settings.privacyLevel = '';
        publishReview.settings.allowComment = false;
        publishReview.settings.allowDuet = false;
        publishReview.settings.allowStitch = false;
        publishReview.settings.commercialContent = false;
        publishReview.settings.yourBrand = false;
        publishReview.settings.brandedContent = false;

        publishReview.onCancel = () => {
            window.history.back();
        };
        publishReview.onPublished = () => {
            if (typeof Toast !== 'undefined') Toast.success('Posted to TikTok!');
        };

        // Fetch creator info and render
        publishReview._loading = true;
        publishReview.renderContent();
        await publishReview.fetchCreatorInfo();
    })();
    </script>
